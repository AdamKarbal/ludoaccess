version: '3.8'

services:
  back:
    build: ../backend          
    ports:
      - "8081:9428"          # localhost:8081 → conteneur:9428
    volumes:
      - my_volume:/var/lib/xyz
    restart: unless-stopped
    healthcheck:
      test : ["CMD","curl","-f","http://localhost:9428/health"]
      interval : 10s
      retries: 5

  front:
    build: ../front-end           
    ports:
      - "8080:80"            # localhost:8080 → conteneur:80
    depends_on:
      - back:
          condition: service-healthy                
    restart: unless-stopped

  volumes:
    my_volume: 
