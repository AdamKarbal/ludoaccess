version: '3.8'

services:
  backe2e:
    environment:
      - PORT=8081
    container_name: backend
    build:
      context: ../backend
      dockerfile: Dockerfilee2e
    ports:
      - "8081:8081"
    volumes:
      - my_volume:/var/lib/xyz
    restart: unless-stopped
    healthcheck:
      test : ["CMD","curl","-f","http://localhost:8081/api/status"]
      interval : 10s
      retries: 5
    networks:
      - app-net

  front:
    container_name: frontend
    build:
      context: ../front-end
      args:
        ENVIRONMENT : docker-e2e
    ports:
      - "8080:80"            # localhost:8080 → conteneur:80
    depends_on:
      - backe2e
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test : ["CMD","curl","-f","http://localhost"]
      interval : 1m30s
      timeout: 10s
      retries: 3

  e2e:
    environment:
      - FRONT_URL=http://front:80
    build:
      context: ../front-end
      dockerfile: DockerfileTest
      target: test
    depends_on:
      - front
    volumes:
      - ./e2e-results:/app/test-results
    networks:
      - app-net
    command: npm run test:e2edocker

volumes:
  my_volume:

networks:
  app-net:

