<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Matrio</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
    <meta charset="UTF-8">
</head>
<body>
    <matrio path="components/template/template" class="brown">
        Jeu
    </matrio>
    <div class="infos">
        <h2>Étape 1</h2>
        <p>Saisie des mots que tu connais déjà</p>
        <h2>Étape 2</h2>
        <p>Récolte des pièces en utilisant Z,Q,S,D</p>
        <p>ou les flèches du clavier</p>
        <h2>Étape 3</h2>
        <p>Écrire le mot une fois que les lettres</p>
        <p>sont toutes récupérées !</p>
    </div>
    <div class="sol"></div>
    <div class="fond">
        <div class="toolbar"></div>
        <img id="pause" alt="pause sign" src="/maquette/src/assets/ressources/pause.png"/>
        <img id="cross" alt="cancel" src="/maquette/src/assets/ressources/cancel.png"/>
        <img id="infoB" alt="infos" src="/maquette/src/assets/ressources/info.png"/>
        <div class="coeurs">
            <img id="hearts" alt="hearts" src="/maquette/src/assets/ressources/hearts.png"/>
        </div>
        <div class="word2Guess">_ R _ _ E</div>
        <div class="level">LVL 3</div>
        <div class="plateformes">
            <div id="plateforme1"></div>
            <div id="plateforme2"></div>
            <div id="plateforme3"></div>
            <div id="plateforme4"></div>
        </div> 
            <div id="pennyA">
                <img id="pennyA" alt="penny" src="/maquette/src/assets/ressources/penny.png"/>
                <div id="pennyA-text">A</div>
            </div>
            <div id="pennyB">
                <img id="pennyB" alt="penny" src="/maquette/src/assets/ressources/penny.png"/>
                <div id="pennyB-text">B</div>
            </div>
            <div id="pennyR">
                <img id="pennyR" alt="penny" src="/maquette/src/assets/ressources/penny.png"/>
                <div id="pennyR-text">R</div>
            </div>
        <div id="personnage"><img id="personnage" alt="perso" src="/maquette/src/assets/ressources/perso.png"/></div>
        <div id="mob"><img id="mob" alt="mob" src="/maquette/src/assets/ressources/mob.png"></div>  
    </div>  
</body>
</html>
