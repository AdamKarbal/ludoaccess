<!DOCTYPE html>
<html>
<body>
<div class="period-buttons">
    <button
      *ngFor="let period of periods"
      (click)="selectPeriod(period.value,$event)"
      [class.active]="period.value === selectedPeriod"
      type="button"
    >
      {{ period.label }}
    </button>



</div>
</body>
</html>
