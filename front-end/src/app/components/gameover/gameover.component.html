<div class="overlay" *ngIf="isGameOver">
    <div class="gameover-box">
      <h1>{{ message }}</h1>
      <div class="buttons">
        <button (click)="OnContinueClick()">Rejouer</button>
        <button id="button_pause" (click)="OnStopClick()">Quitter</button>
      </div>
    </div>
  </div>
