<form *ngIf="currentSettings" class="settings-form" (ngSubmit)="onSettingChange()">
    <h3 class="settings-title">Paramètres</h3>
    
    <div class="settings-group">
      <h4 class="group-title">Affichage</h4>
      
      <label class="setting">
        <input type="checkbox" 
               [(ngModel)]="currentSettings.showTimer"
               name="showTimer">
        <span>Afficher le chronomètre</span>
      </label>
      <label class="setting">
        <span>Taille des caractères :</span>
        <div class="range-inputs">
          <input type="number" 
                 [(ngModel)]="currentSettings.lettersize"
                 name="lettersize"
                 placeholder="sp"
                 min="1" max="60">
        </div>       
      </label>
      <label class="setting">
        <span>Police d'écriture:</span>
        <select [(ngModel)]="currentSettings.choosefont"
                name="choosefont">
          <option value="Lucky Boy">Lucky Boy</option>
          <option value="Nintendo">Nintendo</option>
          <option value="Arial">Arial</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
          <option value="Courier New">Courier New</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Verdana">Verdana</option>
          <option value="Calibri">Calibri</option>
          <option value="cursif ecriture A">cursif ecriture A</option>
          <option value="cursif ecriture B">cursif ecriture B</option>
          <option value="Minecraft">Minecraft</option>
        </select>
      </label>
      <label class="setting">
        <span>Fond du niveau: </span>
        <select [(ngModel)]="currentSettings.chooseBackGround"
                name="chooseBackGround">
          <option value="Aléatoire">Aléatoire</option>
          <option value="Forest">Forest</option>
          <option value="Blue_earth">Blue earth</option>
          <option value="Orange_earth">Orange earth</option>
        </select>
      </label>
      <label class="setting">
        <input type="checkbox" 
               [(ngModel)]="currentSettings.showRanking"
               name="showRanking">
        <span>Afficher le classement</span>
      </label>
    </div>
  
    <div class="settings-group">
      <h4 class="group-title">Difficulté</h4>
      
      <label class="setting">
        <input type="checkbox" 
               [(ngModel)]="currentSettings.enableLifeLoss"
               name="enableLifeLoss">
        <span>Activer la perte de vie</span>
      </label>
  
      <label class="setting">
        <input type="checkbox" 
               [(ngModel)]="currentSettings.jumpDifficulty"
               name="jumpDifficulty">
        <span>Sauts plus compliqués</span>
      </label>

      <label class="setting">
        <input type="checkbox" 
               [(ngModel)]="currentSettings.adaptDifficulty"
               name="adaptDifficulty">
        <span>Adapter la difficulté</span>
      </label>
  
      <label class="setting">
        <input type="checkbox" 
               [(ngModel)]="currentSettings.clearWordAfterRecovery"
               name="clearWordAfterRecovery">
        <span>Effacer le mot après récupération</span>
      </label>
    </div>
  
    <div class="settings-group">
      <h4 class="group-title">Temps et mots</h4>
      
      <label class="setting">
        <span>Temps pour écrire le mot (secondes):</span>
        <input type="number" 
               [(ngModel)]="currentSettings.wordWritingTime"
               name="wordWritingTime"
               min="1" max="60">
      </label>
  

      <label class="setting">
        <span>Simplifier le jeu au bout de (en minutes):</span>
        <div class="range-inputs">
          <input type="number" 
                 [(ngModel)]="currentSettings.simplifyGameAfter"
                 name="simplifyGameAfter"
                 placeholder="minutes"
                 min="1" max="60">
        </div>       
      </label>
  
      <label class="setting">
        <span>Difficulté des mots:</span>
        <select [(ngModel)]="currentSettings.wordDifficulty"
                name="wordDifficulty">
          <option value="Facile">Facile</option>
          <option value="Moyen">Moyen</option>
          <option value="Difficile">Difficile</option>
        </select>
      </label>
    </div>

    <div class="form-actions">
        <button type="button" (click)="onResetSettings()" class="reset-btn">
          Réinitialiser
        </button>
    </div>

  </form>
