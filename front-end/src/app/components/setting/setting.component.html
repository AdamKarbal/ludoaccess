
<form *ngIf="currentSettings" class="settings-form" (ngSubmit)="onSettingChange()">
  <h3 class="settings-title">Paramètres</h3>

  <!-- Groupe : Affichage -->
  <div class="settings-group">
    <h4 class="group-title">Affichage</h4>

    <label class="setting">
      <input type="checkbox" [(ngModel)]="currentSettings.showTimer" name="showTimer" (change)="onSettingChange()">
      <span>Afficher le chronomètre</span>
    </label>

    <label class="setting">
      <span>Taille des caractères :</span>
      <div class="range-inputs">
        <select [(ngModel)]="currentSettings.lettersize" name="lettersize" (change)="onSettingChange()">
          <option value="Petit">Petit</option>
          <option value="Moyen">Moyen</option>
          <option value="Grand">Grand</option>
        </select>
      </div>
    </label>

    <label class="setting">
      <span>Police d'écriture:</span>
      <select [(ngModel)]="currentSettings.choosefont" name="choosefont" (change)="onSettingChange()">
        <option value="Lucky Boy">Lucky Boy</option>
        <option value="Nintendo">Nintendo</option>
        <option value="Arial">Arial</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Courier New">Courier New</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Verdana">Verdana</option>
        <option value="Calibri">Calibri</option>
        <option value="cursif ecriture A">cursif ecriture A</option>
        <option value="cursif ecriture B">cursif ecriture B</option>
        <option value="Minecraft">Minecraft</option>
      </select>
    </label>

    <label class="setting">
      <span>Fond du niveau: </span>
      <select [(ngModel)]="currentSettings.chooseBackGround" name="chooseBackGround" (change)="onSettingChange()">
        <option value="Aléatoire">Aléatoire</option>
        <option value="Forest">Forest</option>
        <option value="Blue_earth">Blue earth</option>
        <option value="Orange_earth">Orange earth</option>
      </select>
    </label>

    <label class="setting">
      <input type="checkbox" [(ngModel)]="currentSettings.showRanking" name="showRanking" (change)="onSettingChange()">
      <span>Afficher le classement</span>
    </label>
  </div>

  <!-- Groupe : Difficulté -->
  <div class="settings-group">
    <h4 class="group-title">Difficulté</h4>

    <label class="setting">
      <input type="checkbox" [(ngModel)]="currentSettings.enableLifeLoss" name="enableLifeLoss" (change)="onSettingChange()">
      <span>Activer la perte de vie</span>
    </label>

    <label class="setting">
      <input type="checkbox" [(ngModel)]="currentSettings.jumpDifficulty" name="jumpDifficulty" (change)="onSettingChange()">
      <span>Sauts plus compliqués</span>
    </label>

    <label class="setting">
      <input type="checkbox" [(ngModel)]="currentSettings.adaptDifficulty" name="adaptDifficulty" (change)="onSettingChange()">
      <span>Adapter la difficulté</span>
    </label>

    <label class="setting">
      <input type="checkbox" [(ngModel)]="currentSettings.clearWordAfterRecovery" name="clearWordAfterRecovery" (change)="onSettingChange()">
      <span>Effacer le mot après récupération</span>
    </label>
  </div>

  <!-- Groupe : Temps et mots -->
  <div class="settings-group">
    <h4 class="group-title">Temps et mots</h4>

    <label class="setting">
      <span>Temps pour écrire le mot (secondes):</span>
      <input type="number" [(ngModel)]="currentSettings.wordWritingTime" name="wordWritingTime" min="1" max="60" (change)="onSettingChange()">
    </label>

    <label class="setting">
      <span>Temps pour afficher le mot (secondes):</span>
      <input type="number" [(ngModel)]="currentSettings.displaymotsec" name="displaymotsec" min="1" max="60" (change)="onSettingChange()">
    </label>

    <label class="setting">
      <span>Simplifier le jeu au bout de (en minutes):</span>
      <div class="range-inputs">
        <input type="number" [(ngModel)]="currentSettings.simplifyGameAfter" name="simplifyGameAfter" placeholder="minutes" min="1" max="60" (change)="onSettingChange()">
      </div>
    </label>

    <label class="setting">
      <span>Nombre de mot:</span>
      <input type="number" [(ngModel)]="currentSettings.numberOfWords" name="numberOfWords" min="1" max="60" (change)="onSettingChange()">
    </label>

    <label class="setting">
      <span>Difficulté des mots:</span>
      <select [(ngModel)]="currentSettings.wordDifficulty" name="wordDifficulty" (change)="onSettingChange()">
        <option value="Facile">Facile</option>
        <option value="Moyen">Moyen</option>
        <option value="Difficile">Difficile</option>
      </select>
    </label>
  </div>

  <!-- Actions -->
  <div class="form-actions">
    <button type="button" (click)="onResetSettings()" class="reset-btn" >Réinitialiser</button>
    <button type="button" class="nav-btn" routerLink="/stats">Statistiques</button>
  </div>
</form>
