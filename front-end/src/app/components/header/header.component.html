<div class="headerreglage">
    <div class="user" *ngIf="currentUser">
      <img [src]="currentUser.imageUrl || ' ../../../assets/ressources/ergo.jpg'" alt="Avatar Ergothérapeute">
      <div class="username">{{ currentUser.firstName }} {{ currentUser.lastName }}</div>
    </div>
    <div class="logout">
      <button (click)="logout()" routerLink="/">Déconnexion</button>
    </div>
  </div>
