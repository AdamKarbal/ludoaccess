<div class="toolbar">
        <img id="pause" alt="pause sign" src="../../../assets/ressources/pause.png" (click)=" OnPauseClick()"/>
        <img id="cross" alt="cancel" src="../../../assets/ressources/cancel.png"(click)="OnExitClick()"/>
        <img id="infoB" alt="infos" src="../../../assets/ressources/info.png"/>

        
</div>
<!-- <div *ngIf="isPaused" class="pause-overlay"></div> -->
<div *ngIf="isPaused" class="pause-message" (click)="OnPauseClick()">
        <p>⏸ Petite pause...</p>
        <button id="button_pause"(click)="OnResumeClick()">PARAMÈTRES</button>
        <button id="button_pause"(click)="OnResumeClick()">REPRENDRE</button>
        <button id="button_pause"(click)="OnResumeClick()">RECOMMENCER</button>
</div>
<div *ngIf="isCrossed" class="exit-message" (click)="OnExitClick()">
        <p>Voulez-vous quitter la partie ?</p>
        <button id="button_pause"(click)="OnResumeClick()">OUI</button>
        <button id="button_pause"(click)="OnResumeClick()">NON</button>

</div>
