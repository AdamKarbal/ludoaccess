
<ng-container *ngIf="isStep2Active">
<div class="game-ui">
    <app-levelbar></app-levelbar>
     <app-word2guess>
      [mode]="'coin'"
      [userInput]="userInput"
     </app-word2guess>
    <app-mob class="mob"></app-mob>
    <app-player></app-player>
    <app-ground></app-ground>
    <app-coeurs></app-coeurs>
  </div>
  
  <div class="game-zone">
    <app-plateformes></app-plateformes>
  </div>

<app-mini-game *ngIf="isActive$ | async"></app-mini-game>
<app-gameover *ngIf="isGameOver" (replay)="onReplay()"></app-gameover>
