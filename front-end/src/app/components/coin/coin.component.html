<div 
  class="coin" 
  [ngClass]="{ 'collecting': collecting }"
  *ngIf="(coin.letter !== '') && !coin.isCollected" 
  [style.background-image]="'url(' + imagePath + ')'"
  (click)="onClickCollect($event)">
</div>

<div *ngIf="showAura" 
  class="aura" 
  [ngStyle]="{'top.px': auraY, 'left.px': auraX}">
</div>
