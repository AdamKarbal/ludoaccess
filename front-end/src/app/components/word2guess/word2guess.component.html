<div class="word2Guess">
    <div id="mot">

        <span *ngFor="let letter of word.split(''); let i = index" [ngStyle]="{'color': guessedIndexes.includes(i) ? 'black' : 'grey',
        'padding': '10px 2px'}">
        {{letter}}
      </span>
    </div>
    <div id="tirets">{{hiddenWord}}</div>
    <!-- <input type="text" (input)="checkLetter($event)" maxlength="1" placeholder="Tape une lettre" /> -->
</div>
