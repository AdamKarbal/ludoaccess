<div class="word2Guess">
  <div id="mot" [style.font-family]="currentFont">
    <!-- Si mode = coin => affichage simple avec display -->
  <ng-container *ngIf="mode === 'coin'; else typingMode">
    {{ display }}
  </ng-container>
  <!-- Si mode = typing => affichage avec lettres individuelles -->
  <ng-template #typingMode>
      <span  *ngFor="let letter of word.split(''); let i = index"

      
      [ngClass]="{
    'correct': guessedIndexes.includes(i),
    'incorrect': incorrectLetters.has(i)
    }"
       
      [ngStyle]="{
        'color': incorrectLetters.has(i) ? 'red' : guessedIndexes.includes(i) ? 'black' : 'grey', 
        'border-bottom': guessedIndexes.includes(i) ? 'none' : '2px solid grey',
        'padding': '13px 2px'
      }"
      class="letter"
        >
      {{letter}}
    </span>
  </ng-template>
  </div>
  
  <!-- <input type="text" (input)="checkLetter($letter)" maxlength="1" placeholder="Tape une lettre" /> -->
</div>
