<div *ngIf="showW2g">
  <div class="word-counter" *ngIf="showCount">
    Mot {{ wordIndex }} / {{ totalWords }}
  </div>
<div class="word2Guess">
  <div id="mot" [style.font-family]="currentFont">
    <ng-container *ngIf="mode === 'coin'; else typingMode">
      {{ display }}
    </ng-container>
    <ng-template #typingMode>

      <span *ngFor="let letter of word2GuessService.getWord().split(''); let i = index" [ngClass]="{
    'correct': guessedIndexes.includes(i),
    'incorrect': word2GuessService.getIncorrectIndexes().has(i)
    }" [ngStyle]="{
        'color': word2GuessService.getIncorrectIndexes().has(i) ? 'red' : guessedIndexes.includes(i) ? 'black' : '#555',
        'border-bottom': guessedIndexes.includes(i) ? 'none' : '2px solid #555',
        'padding': '13px 2px'
      }" class="letter">
        {{letter}}
      </span>
    </ng-template>
  </div>
</div>
</div>
