<app-header></app-header>

<div class="page-ergotherapeute">
  <div class="arriere-plan"></div>
  <div class="contenu">
    <div class="ligne-titre">
      <app-retour></app-retour>
      <h1 class="titre">Page Ergothérapeute</h1>
    </div>
    <button class="btn-ajouterMot" (click)="toggleFormMot()">Ajouter un mot</button>
    <div class="form-ajout" *ngIf="formVisibleMot">
      <input [(ngModel)]="newWord.value" placeholder="Mot" />
      <select class="selector2" [(ngModel)]="newWord.level">
        <option value="1">Facile</option>
        <option value="2">Moyen</option>
        <option value="3">Difficile</option>
      </select>
      <button class="btn-valider" (click)="onAddWord()">Valider</button>
    </div>


    <ng-container>
      <div class="form-words">
        <div class="ligne-difficulte">
          <h3 class="title-diff">Difficulté des mots :</h3>
          <select class="selector" [(ngModel)]="toDelWord.level">
            <option value="1">Facile</option>
            <option value="2">Moyen</option>
            <option value="3">Difficile</option>
          </select>
        </div>

          <div *ngIf="toDelWord.level == 1">
            <div class="scrollable-words">
                <div class="word-container" *ngFor="let word of easyWords">
                  <div class="word-text">{{ word.value }}</div>
                  <img src="../assets/ressources/trashcan.png" alt="Supprimer" class="delete-btn" (click)="onDeleteWord(word)"/>
                </div>
            </div>
          </div>
          <div *ngIf="toDelWord.level == 2">
            <div class="scrollable-words">
                <div class="word-container" *ngFor="let word of mediumWords">
                  <div class="word-text">{{ word.value }}</div>
                  <img src="../assets/ressources/trashcan.png" alt="Supprimer" class="delete-btn" (click)="onDeleteWord(word)"/>
                </div>
            </div>
          </div>
          <div *ngIf="toDelWord.level == 3">
            <div class="scrollable-words">
                <div class="word-container" *ngFor="let word of hardWords">
                  <div class="word-text">{{ word.value }}</div>
                  <img src="../assets/ressources/trashcan.png" alt="Supprimer" class="delete-btn" (click)="onDeleteWord(word)"/>
                </div>
            </div>
          </div>
      </div>
    </ng-container>

  </div>
</div>
