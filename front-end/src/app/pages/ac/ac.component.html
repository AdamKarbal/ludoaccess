    class="arriere-plan fade-bg" 
    [ngStyle]="{'background-image': 'url(' + fadeBgUrl + ')', 'opacity': fade ? 1 : 0}">
  </div>
  <div class="contenu">
    <h1 class="titre">Ludo Access</h1>
  </div>
  <div class="groupe-boutons">

      <button class="btn-principal" routerLink="/jeu">Jouer</button>

    </div>
  </div>
  <app-classement *ngIf="displayed"></app-classement>
